dependencies {
	// Spring Data Redis 라이브러리
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'

	implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16'
	// JSON 처리를 위한 Jackson
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	implementation 'io.jsonwebtoken:jjwt-impl:0.13.0'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.13.0'
	implementation 'org.springframework.boot:spring-boot-starter-kafka'

	// TSID 사용을 위한 유틸리티
	implementation 'io.hypersistence:hypersistence-utils-hibernate-70:3.15.2'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'

	runtimeOnly 'com.mysql:mysql-connector-j'
	// -------------------------------------------------------------------------
	// 🎯 Spring Boot 4.0 규격 기술별 전용 테스트 스타터 매칭
	// -------------------------------------------------------------------------
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'net.datafaker:datafaker:2.5.4'

	// 🔥 [핵심] WebMvcTest 가동 시 Security가 있으면 이 두 녀석이 '무조건' 세트로 존재해야 컨텍스트가 터지지 않습니다.
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'

	// OpenAPI 스펙 명세용 라이브러리
	testImplementation 'org.springframework.boot:spring-boot-starter-restdocs'
	testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.20.1'

}

tasks.named('test') {
	useJUnitPlatform() // 이 설정이 없으면 JUnit 5 테스트를 인식하지 못합니다.
}

// 서비스 모듈은 실행 가능한 jar 파일로 빌드되어야 합니다.
bootJar {
	enabled = true
}

jar {
	enabled = false // 실행 jar가 우선이므로 일반 jar는 끕니다.
}